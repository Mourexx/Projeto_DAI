services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: tub_user
      POSTGRES_PASSWORD: tub_pass
      POSTGRES_DB: tub_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tub_user -d tub_db"]
      interval: 5s
      timeout: 5s
      retries: 10
 
  backend:
    build: ./backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
 
  frontend:
    build: ./frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
 
volumes:
  postgres_data:
 